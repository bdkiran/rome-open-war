name: Test

# Off for now: runs only when started by hand (Actions tab > Test > Run
# workflow). To run it on every push and pull request again, restore:
#   push:
#     branches: [master]
#   pull_request:
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
